name: Continuous integration

on:
  push:

env:
  HAS_SECRETS: ${{ secrets.HAS_SECRETS }}

jobs:
  build:
    name: Continuous integration
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    if: "!startsWith(github.event.head_commit.message, '[skip ci] ')"

    outputs:
      success: ${{ steps.success.outputs.success }}

    steps:
      - run: dpkg --list
      - run: pip freeze --all
        # Remove Python packages with wrong version
      - run: sudo apt-get remove python3-debian python3-distro-info
      - run: docker system prune --all --force
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python3 -m pip install --requirement=ci/requirements.txt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: "pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}\npre-commit-"
      - run: pre-commit run --all-files --color=always
        env:
          SKIP: poetry-lock,isort
      - run: git diff --exit-code --patch > /tmp/pre-commit.patch; git diff --color; git reset --hard || true
        if: failure()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Apply pre-commit fix.patch
          path: /tmp/pre-commit.patch
          retention-days: 1
        if: failure()
      - name: Print environment information
        run: c2cciutils-env

      - name: Pull
        run: make pull

      - name: Build
        run: make build

      - name: Checks
        run: make checks

      - run: pip install --editable .
      - name: Acceptance
        run: make acceptance
      - timeout-minutes: 1
        run: (cd acceptance_tests/tests/; c2cciutils-docker-logs)
        if: always()
      - run: make acceptance-stop

      - name: Acceptance Dev
        run: WAITRESS=TRUE make acceptance

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Acceptance tests results
          path: acceptance_tests/out/results
        if: always()

      # The image is given to the publishing job, which is the only one with the write permissions.
      - run: docker save --output=/tmp/images.docker camptocamp/c2cwsgiutils:latest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images.docker
          path: /tmp/images.docker
          retention-days: 1

      # Mark as success
      - id: success
        run: echo "success=true" >> $GITHUB_OUTPUT

  publish:
    name: Publish
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: build
    if: always()

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - run: '[[ "${{ needs.build.outputs.success }}" == "true" ]]'

      # The full history is required to compute the version from the tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Provides the pip, python3 and poetry that tag-publish calls to build the wheel.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python3 -m pip install '--only-binary=:all:' --requirement=ci/requirements.txt

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest-known
          cache-python: true
          python-version: '3.13'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images.docker
          path: /tmp/
      - run: docker load --input=/tmp/images.docker

      - name: Publish
        run: uv run --locked --isolated --project=.github/publish tag-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: git diff --exit-code --patch > /tmp/dpkg-versions.patch; git diff --color; git reset --hard || true
        if: failure()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Update dpkg versions list.patch
          path: /tmp/dpkg-versions.patch
          retention-days: 1
        if: failure()

permissions:
  contents: read
