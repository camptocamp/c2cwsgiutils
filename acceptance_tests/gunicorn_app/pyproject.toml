[tool.black]
line-length = 110
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 110
known_local_folder = ["c2cwsgiutils_app"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict = true

[tool.poetry]
name = "c2cwsgiutils_app"
version = "0.1.0"
description = "Test application for c2cwsgiutils"
authors = ["Camptocamp <info@camptocamp.com>"]
classifiers = [
    'Framework :: Pyramid',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Internet :: WWW/HTTP',
    'Topic :: Internet :: WWW/HTTP :: WSGI :: Application',
]
packages = [{ include = "c2cwsgiutils_app" }]

[tool.poetry.scripts]
get-hello = "c2cwsgiutils_app.get_hello:main"

[tool.poetry.plugins."paste.app_factory"]
main = "c2cwsgiutils_app:main"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
coverage = "7.15.4"

[tool.poetry.dev-dependencies]
# pylint = { version = "2.15.6" }
prospector = { version = "1.19.1", extras = ["with_bandit", "with_mypy", "with_ruff"] }
prospector-profile-duplicated = "1.12.0"
prospector-profile-utils = "1.27.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
